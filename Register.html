<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-in</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/style.css" />
     <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .date-input::-webkit-calendar-picker-indicator {
        display: none;
      }

      .date-input {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
   <div
      class="container-navbar"
      style="
        background-color: #ffffff;
        height: 70px;
        display: flex;
        align-items: center;
      "
    >
      <!--Navbar -->
      <nav class="navbar navbar-expand-lg w-100 h-100">
        <div class="container position-relative">
          <!-- Logo -->
          <div class="d-flex align-items-center">
            <img
              src="img/Group.png"
              width="25"
              height="25"
              style="margin-right: 8px"
            />

            <a
              href="#"
              class="navbar-brand"
              style="font-size: 14px; font-weight: 600; color: #333"
            >
              my Dream Place
            </a>
          </div>

        </div>
      </nav>
    </div>

    <!--page content-->
    <div class="container mt-5" style="max-width: 400px">
      <form>
        <h3 class="fw-semibold mb-5 text-center">Register</h3>
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label fw-semibold"
            >Email address</label
          >
          <input
            type="email"
            class="form-control"
            id="exampleInputEmail1"
            aria-describedby="emailHelp"
            style="background-color: #F2F2F2"
          />
        </div>
       <a href="home.html" class="btn btn-primary w-100 mt-2 mb-3"
        style="padding:12px 18px; background-color:#2F80ED;border-color:#2F80ED;"
        >
          Continue with email
        </a>

        <div class="d-flex align-items-center my-4">
          <hr class="flex-grow-1" />
          <span class="mx-3 text-muted small">or use one of these options</span>
          <hr class="flex-grow-1" />
        </div>
        <button type="submit" class="btn btn-outline-secondary  btn-no-hover w-100 mt-2 mb-2 btn-no-hover"style="padding:12px 18px;">
          <div
            class="google-btn d-flex align-items-center justify-content-center fw-semibold"
            style="gap: 5px"
          >
            <img src="img/g.png" width="30" height="30" class="me-2" />
            Continue with Google
          </div>
        </button>
        <button
          type="submit"
          class="btn btn-outline-secondary w-100 mt-2 mb-3"
          style="background-color: #475993; color: white; border: none;padding:12px 18px;"
        >
          <div
            class="fb d-flex align-items-center justify-content-center"
            style="gap: 5px"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="currentColor"
              class="me-2 bi bi-facebook"
              viewBox="0 0 16 16"
            >
              <path
                d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"
              />
            </svg>

            Continue with Facebook
          </div>
        </button>
      </form>
      <div
        class="container d-flex justify-content-center align-items-center mt-3"
        style="gap: 5px"
      >
        <a
          href="#"
          class="float-end"
          style="text-decoration: none; font-size: 13px"
          ><span class="text-secondary">Already have an account?</span> Sign in</a
        >
      </div>
    </div>

    <!--page content-->

    <script>
      document.querySelectorAll("label").forEach((label) => {
        label.addEventListener("click", function () {
          const input = document.getElementById(this.getAttribute("for"));

          input.showPicker();
        });
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
 
  </body>
</html>
