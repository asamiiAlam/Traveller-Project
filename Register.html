<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-in</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="index.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .date-input::-webkit-calendar-picker-indicator {
        display: none;
      }

      .date-input {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div
      class="container-navbar"
      style="
        background-color: #ffffff;
        height: 70px;
        display: flex;
        align-items: center;
      "
    >
      <!--Navbar -->
      <nav class="navbar navbar-expand-lg w-100 h-100">
        <div class="container position-relative">
          <!-- Logo -->
          <div class="d-flex align-items-center">
            <img
              src="img/Group.png"
              width="25"
              height="25"
              style="margin-right: 8px"
            />

            <a
              href="#"
              class="navbar-brand"
              style="font-size: 14px; font-weight: 600; color: #333"
            >
              my Dream Place
            </a>
          </div>

          <!-- Hamburger -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Menu -->
          <div
            class="collapse navbar-collapse"
            id="navbarNav"
            style="z-index: 1000"
          >
            <ul class="navbar-nav mx-auto text-center" style="gap: 25px">
              <li class="nav-item">
                <a class="nav-link" href="#">Home</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Discover</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Activities</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">About</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Contact</a>
              </li>
            </ul>
          </div>

          <!-- Right side -->
          <div class="d-flex align-items-center">
            <div class="position-relative me-2">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="grey"
                viewBox="0 0 16 16"
              >
                <path
                  d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2m.995-14.901a1 1 0 1 0-1.99 0A5 5 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901"
                />
              </svg>
            </div>

            <img
              src="img/user.png"
              width="40"
              height="40"
              style="border-radius: 50%; object-fit: cover"
            />
          </div>
        </div>
      </nav>
    </div>

    <!--page content-->
    <div class="container mt-5" style="max-width: 400px">
      <form>
        <h3 class="fw-semibold mb-3 text-center">Register</h3>
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label fw-semibold"
            >Email address</label
          >
          <input
            type="email"
            class="form-control"
            id="exampleInputEmail1"
            aria-describedby="emailHelp"
            style="background-color: #F2F2F2"
          />
        </div>
  
     
        <button type="submit" class="btn btn-primary w-100 mt-2 mb-3">
          Continue with email
        </button>

        <div class="d-flex align-items-center my-4">
          <hr class="flex-grow-1" />
          <span class="mx-3 text-muted small">or use one of these options</span>
          <hr class="flex-grow-1" />
        </div>
        <button type="submit" class="btn btn-outline-secondary w-100 mt-2 mb-3">
          <div
            class="google d-flex align-items-center justify-content-center"
            style="gap: 5px"
          >
            <img src="img/g.png" width="30" height="30" class="me-2" />
            Continue with Google
          </div>
        </button>
        <button
          type="submit"
          class="btn btn-outline-secondary w-100 mt-2 mb-3"
          style="background-color: #475993; color: white; border: none"
        >
          <div
            class="fb d-flex align-items-center justify-content-center"
            style="gap: 5px"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="currentColor"
              class="me-2 bi bi-facebook"
              viewBox="0 0 16 16"
            >
              <path
                d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"
              />
            </svg>

            Continue with Facebook
          </div>
        </button>
      </form>
      <div
        class="container d-flex justify-content-center align-items-center mt-3"
        style="gap: 5px"
      >
        <a
          href="#"
          class="float-end"
          style="text-decoration: none; font-size: 13px"
          ><span class="text-secondary">Already have an account?</span> Sign in</a
        >
      </div>
    </div>

    <!--page content-->

    <script>
      document.querySelectorAll("label").forEach((label) => {
        label.addEventListener("click", function () {
          const input = document.getElementById(this.getAttribute("for"));

          input.showPicker();
        });
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
 
  </body>
</html>
