<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-in</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="index.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .date-input::-webkit-calendar-picker-indicator {
        display: none;
      }

      .date-input {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div
      class="container-navbar"
      style="
        background-color: #ffffff;
        height: 70px;
        display: flex;
        align-items: center;
      "
    >
      <!--Navbar -->
      <nav class="navbar navbar-expand-lg w-100 h-100">
        <div class="container position-relative">
          <!-- Logo -->
          <div class="d-flex align-items-center">
            <img
              src="img/Group.png"
              width="25"
              height="25"
              style="margin-right: 8px"
            />

            <a
              href="#"
              class="navbar-brand"
              style="font-size: 14px; font-weight: 600; color: #333"
            >
              my Dream Place
            </a>
          </div>

          <!-- Hamburger -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Menu -->
          <div
            class="collapse navbar-collapse"
            id="navbarNav"
            style="z-index: 1000"
          >
            <ul class="navbar-nav mx-auto text-center" style="gap: 25px">
              <li class="nav-item">
                <a class="nav-link" href="#">Home</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Discover</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Activities</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">About</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Contact</a>
              </li>
            </ul>
          </div>

          <!-- Right side -->
          <div class="d-flex align-items-center">
            <div class="position-relative me-2">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="grey"
                viewBox="0 0 16 16"
              >
                <path
                  d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2m.995-14.901a1 1 0 1 0-1.99 0A5 5 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901"
                />
              </svg>
            </div>

            <img
              src="img/user.png"
              width="40"
              height="40"
              style="border-radius: 50%; object-fit: cover"
            />
          </div>
        </div>
      </nav>
    </div>

    <!--page content-->
    <div class="container mt-5" style="max-width: 400px">
      <form>
        <h3 class="fw-semibold mb-3 text-center">Create a Password</h3>
        <p class="text-center fw-semibold text-secondary">
          Use a minimum of 8 characters with a mix of letters, numbers, and
          symbols.
        </p>

        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label fw-semibold">
            Password
          </label>

          <div class="position-relative">
            <input
              type="password"
              class="form-control pe-5"
              id="exampleInputPassword1"
              style="background-color: #f2f2f2"
            />

            <i
              class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3"
              id="togglePassword"
              style="cursor: pointer"
            ></i>
          </div>
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label fw-semibold">
            Confirm Password
          </label>

          <div class="position-relative">
            <input
              type="password"
              class="form-control pe-5"
              id="exampleInputPassword2"
              style="background-color: #f2f2f2"
            />

            <i
              class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3"
              id="togglePassword1"
              style="cursor: pointer"
            ></i>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2 mb-3">
          Continue with email
        </button>
      </form>
      <div
        class="container text-start mt-3 fw-semibold"
        style="font-size: 12px; line-height: 1.4rem; color: #777"
      >
        By Creating an account, you agree to our
        <a href="#" class="text-decoration-none">Terms of our Service</a>
        and
        <a href="#" class="text-decoration-none">Privacy Policy</a>.
      </div>
    </div>

    <!--page content-->

    <script>
      document.querySelectorAll("label").forEach((label) => {
        label.addEventListener("click", function () {
          const input = document.getElementById(this.getAttribute("for"));

          input.showPicker();
        });
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      const togglePassword = document.querySelector("#togglePassword");
      const password = document.querySelector("#exampleInputPassword1");
      const togglePassword1 = document.querySelector("#togglePassword1");
      const password2 = document.querySelector("#exampleInputPassword2");

      togglePassword1.addEventListener("click", function () {
        const type =
          password2.getAttribute("type") === "password" ? "text" : "password";

        password2.setAttribute("type", type);

        this.classList.toggle("bi-eye");
        this.classList.toggle("bi-eye-slash");
      });

      togglePassword.addEventListener("click", function () {
        const type =
          password.getAttribute("type") === "password" ? "text" : "password";

        password.setAttribute("type", type);

        this.classList.toggle("bi-eye");
        this.classList.toggle("bi-eye-slash");
      });
    </script>
  </body>
</html>
