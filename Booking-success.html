<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Successful</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
     <link rel="stylesheet" href="css/index.css">
      <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">

    <style>

        body {
           
            min-height: 100vh;
        }


        .success-card {

            width: 380px;
            border-radius: 12px;
            padding: 40px 22px 25px;

        }


        .success-image {

            width: 230px;
            height: 190px;
            object-fit: contain;

            background-color: #e2f4ed;
            border-radius: 10px;

        }


        .success-title {

            font-size: 20px;
            font-weight: 600;
            margin-top: 45px;

        }


        .success-message {

            color: #666;
            font-size: 16px;
            line-height: 1.4;

        }


        .view-btn {

            height: 42px;
            background-color: #377fe5;
            border: none;
            border-radius: 5px;

        }


        .view-btn:hover {

            background-color: #286bd0;

        }


    </style>

</head>


<body>


<div class="container min-vh-100 d-flex justify-content-center align-items-center">




    <div class="card success-card shadow-sm text-center ">


        <!-- Success Image -->

        <div class="d-flex justify-content-center ">

            <img 
            src="img/booking.png" 
            class="success-image p-3"
            alt="Booking Successful">

        </div>



        <!-- Title -->

        <h2 class="success-title">

            Booking Successful

        </h2>



        <!-- Description -->

        <p class="success-message mt-3">

            Congratulations your reservation has been made.<br>

            You will be notified 2 days prior the date.

        </p>



        <!-- Button -->

        <a href="detail.html" class="btn btn-primary w-100 mt-4 view-btn">

            View Trip

        </a>


    </div>


</div>


</body>

</html>
